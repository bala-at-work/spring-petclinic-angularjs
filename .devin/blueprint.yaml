# Repository blueprint — bala-at-work/spring-petclinic-angularjs (archetype A-boot-spa).
# Generated by @skills:java-modernization-assess (kit v0.4) from commands run in the assessment session.
# App-specific only; shared toolchains (JDKs, Node, Maven mirror) live in the org blueprint.

clone:
  ref: master

maintenance:
  - name: "Warm dependency cache (Maven, Node 4.4.3, npm, Bower)"
    run: |
      cd ~/repos/spring-petclinic-angularjs
      # install (not dependency:go-offline): the server module resolves spring-petclinic-client
      # from ~/.m2, so the client must be installed first. '|| true' keeps a broken legacy
      # build from failing the snapshot.
      JAVA_HOME=${JAVA_HOME_8:-/usr/lib/jvm/temurin-8-jdk-amd64} ./mvnw -B -q -DskipTests install || true

knowledge:
  - name: current-jdk
    contents: |
      JDK 8 (Spring Boot 2.1.3 parent sets java.version=1.8). Use JAVA_HOME=$JAVA_HOME_8 for every
      Maven command until the java-upgrade task (T5) merges; then update this entry.
  - name: build
    contents: |
      cd ~/repos/spring-petclinic-angularjs
      JAVA_HOME=$JAVA_HOME_8 ./mvnw -B clean install
      # BUILD SUCCESS, ~11 s wall clock on a warm cache (assessment session). Builds the client webjar
      # (frontend-maven-plugin 1.3 downloads Node v4.4.3 + npm 2.15.1 into
      # spring-petclinic-client/target, then npm install, bower install, gulp) and the server
      # boot jar spring-petclinic-server/target/petclinic.jar.
      # Ordering: use 'install' from the root. 'package', or '-pl spring-petclinic-server'
      # without a prior install, fails: "Could not find artifact
      # org.springframework.samples:spring-petclinic-client:jar:2.1.3".
  - name: test
    contents: |
      cd ~/repos/spring-petclinic-angularjs
      JAVA_HOME=$JAVA_HOME_8 ./mvnw -B verify
      # Baseline: Tests run: 3, Failures: 0, Errors: 0, Skipped: 0 (VetResourceTests,
      # PetResourceTests, ValidatorTests). The 10 tests in abstract AbstractClinicServiceTests
      # never run (no concrete subclass) - characterization-tests task T2 fixes that.
  - name: run
    contents: |
      # after the build entry (needs spring-petclinic-client installed in ~/.m2)
      cd ~/repos/spring-petclinic-angularjs/spring-petclinic-server
      JAVA_HOME=$JAVA_HOME_8 ../mvnw -B spring-boot:run
      # -> http://localhost:8080/  (AngularJS UI, hash routes like /#!/owners)
      # REST at the root (/owners/list, /vets, /petTypes ...); actuator at /manage (health, info).
      # Profiles default to hsqldb,prod (in-memory HSQLDB seeded from db/hsqldb/*.sql).
  - name: smoke
    contents: |
      UI smoke: not present yet - added by characterization-tests (T3, Playwright in e2e/).
      Until then, with the app running (run entry), this HTTP check was used:
      for p in / /vets /owners/list /owners/1 /petTypes /scripts/app.js /manage/health; do printf "%s %s\n" "$p" "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080$p)"; done
      # expected: 200 for every path
  - name: modules
    contents: |
      pom.xml                    parent POM (packaging pom), parent = spring-boot-starter-parent 2.1.3.RELEASE
      spring-petclinic-client/   AngularJS 1.6 SPA (Bower + Gulp via frontend-maven-plugin), packaged as a
                                 jar/webjar with assets under public/ (angular, bootstrap, jquery, scripts, css)
      spring-petclinic-server/   Spring Boot REST API (Spring MVC + Data JPA + JCache/Ehcache 3), Thymeleaf
                                 index.html host page; depends on spring-petclinic-client
      Build order: client before server (reactor handles it from the root).
  - name: known-baseline-risks
    contents: |
      - Only 3 tests actually execute; there is no API or UI safety net yet (T2, T3).
      - repo.spring.io/milestone is declared in pom.xml:63-74 and consulted before Central for every
        artifact; not needed for .RELEASE versions (pom.xml:62); remove in T1.
      - Maven wrapper 3.3.3 (.mvn/wrapper/maven-wrapper.properties), Node v4.4.3 / npm 2.15.1 and Gulp 3
        are long EOL; Gulp 3 will not run on modern Node (frontend tasks T9/T10).
      - Spring Boot 2.1.3, AngularJS 1.6.10 are EOL; many critical CVEs (see MODERNIZATION_PLAN.md §3).
      - management.endpoints.web.exposure.include=* exposes every actuator endpoint at /manage.
      - Never committed: node_modules/, bower_components/, target/ (all gitignored, created by the build).
